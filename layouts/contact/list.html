{{ define "main" }}
<section class="page-content section-with-gradient">
    <div class="container">
        <div class="elegant-card">
            <h1>{{ .Title }}</h1>
            {{ if .Content }}
            <div class="post-body">
                {{ .Content | safeHTML }}
            </div>
            {{ end }}
        </div>

        <div class="contact-concerts-cta elegant-card">
            <p>{{ i18n "booking_concerts_info" | default "For booking information and upcoming concert dates" }}</p>
            <a href="{{ "concerts/" | relLangURL }}" class="btn-primary">{{ i18n "upcoming_concerts" | default "Upcoming Concerts" }}</a>
        </div>
    </div>
</section>
{{ end }}
