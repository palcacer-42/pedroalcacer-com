{{/* Shortcode: program PDF viewer */}}
{{ $src := .Get "src" }}
{{ if $src }}
<div class="program-pdf-viewer" style="margin: 2rem 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
  <object data="{{ $src | relURL }}" type="application/pdf" width="100%" height="800px">
    <p>{{ i18n "pdf_fallback" | default "Your browser does not support PDFs." }} <a href="{{ $src | relURL }}">{{ i18n "download_pdf" | default "Download the PDF" }}</a>.</p>
  </object>
</div>
{{ end }}
