{{/* Shortcode: localized contact form using Formspree */}}
{{ $lang := .Page.Language.Lang | default "en" }}
<form action="https://formspree.io/f/mbdlnanv" method="POST" style="max-width: 600px; margin: 2rem 0;">
  <div style="margin-bottom: 1rem;">
    <label for="name" style="display: block; margin-bottom: 0.5rem;">{{ i18n "contact_name" | default "Name" }}:</label>
    <input type="text" id="name" name="name" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
  </div>

  <div style="margin-bottom: 1rem;">
    <label for="email" style="display: block; margin-bottom: 0.5rem;">{{ i18n "contact_email" | default "Email" }}:</label>
    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
  </div>

  <div style="margin-bottom: 1rem;">
    <label for="subject" style="display: block; margin-bottom: 0.5rem;">{{ i18n "contact_subject" | default "Subject" }}:</label>
    <input type="text" id="subject" name="_subject" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
  </div>

  <div style="margin-bottom: 1rem;">
    <label for="message" style="display: block; margin-bottom: 0.5rem;">{{ i18n "contact_message" | default "Message" }}:</label>
    <textarea id="message" name="message" rows="6" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;"></textarea>
  </div>

  <input type="hidden" name="_next" value="{{ .Site.BaseURL }}{{ $lang }}/contact/">

  <button type="submit" style="background-color: #8b7355; color: white; padding: 0.75rem 2rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">{{ i18n "contact_send" | default "Send Message" }}</button>
</form>
