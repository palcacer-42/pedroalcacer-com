{{/* Shortcode: responsive YouTube playlist embed */}}
{{ $listId := .Get "id" }}
{{ if $listId }}
<div class="video-wrap" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;">
  <iframe src="https://www.youtube.com/embed/videoseries?list={{ $listId }}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen loading="lazy"></iframe>
</div>
{{ end }}
